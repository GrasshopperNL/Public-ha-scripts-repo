###############################################################################
# Zaptec Solar Charging - configuration.yaml toevoegingen
#
# Voeg onderstaande blokken toe aan jouw bestaande configuration.yaml
# Pas YOUR_INSTALL_NAME aan naar jouw Zaptec installatienaam
###############################################################################

input_boolean:
  zaptec_geforceerd_laden:
    name: Geforceerd laden
    icon: mdi:ev-station

template:
  - sensor:
      - name: Zaptec laadstroom fase
        icon: mdi:sine-wave
        state: >
          {% if states('number.YOUR_INSTALL_NAME_3_to_1_phase_switch_current') | int == 0 %}
            3-fase
          {% else %}
            1-fase
          {% endif %}

