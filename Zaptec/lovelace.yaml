###############################################################################
# Zaptec Solar Charging - Dashboard kaart
#
# Pas YOUR_INSTALL_NAME aan naar jouw Zaptec installatienaam
###############################################################################

type: horizontal-stack
cards:
  - type: button
    name: Geforceerd laden
    icon: mdi:ev-station
    tap_action:
      action: toggle
    entity: input_boolean.geforceerd_laden
    show_state: true
  - graph: line
    type: sensor
    name: Zonproductie
    icon: mdi:solar-power
    detail: 1
    entity: sensor.solaredge_current_power
  - graph: line
    type: sensor
    entity: number.YOUR_INSTALL_NAME_available_current
    name: Laadstroom ingesteld
    icon: mdi:current-ac
    detail: 1

---

type: horizontal-stack
cards:
  - graph: none
    type: sensor
    entity: sensor.zaptec_laadstroom_fase
    name: Fase
    icon: mdi:sine-wave
    detail: 1
  - graph: line
    type: sensor
    entity: sensor.YOUR_CHARGER_NAME_charge_power
    icon: mdi:solar-power
    detail: 2
    name:
      type: entity
    hours_to_show: 24
    limits:
      max: 11500