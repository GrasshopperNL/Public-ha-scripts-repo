###############################################################################
# Zaptec Solar Charging Automations (simplified, no phase switching)
#
# Vereisten:
#   - Zaptec Go 2 laadpaal
#   - custom-components/zaptec integratie (via HACS)
#   - SolarEdge integratie in Home Assistant
#   - Home Assistant Companion App (Android/iOS)
#
# Pas de volgende placeholders aan naar jouw situatie:
#   - YOUR_INSTALL_NAME   : naam van jouw Zaptec installatie (bv. GNP345345345)
#   - YOUR_CHARGER_NAME   : naam van jouw Zaptec laadpaal (bv. laadpaal_garage)
#   - YOUR_MOBILE_APP     : naam van jouw mobiele app (bv. pixel_9_pro_xl)
###############################################################################

- id: 'zaptec_zonnepaneel_laden_zonder_fasewisseling'
  alias: Zaptec zonnepaneel laden zonder fasewisseling
  description: Zonneladen op 1-fase of geforceerd laden
  triggers:
    - trigger: state
      entity_id: input_boolean.geforceerd_laden
    - trigger: state
      entity_id: sensor.solaredge_current_power
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.geforceerd_laden
              state: 'on'
          sequence:
            - action: number.set_value
              target:
                entity_id: number.YOUR_INSTALL_NAME_available_current
              data:
                value: 16
        - conditions:
            - condition: state
              entity_id: input_boolean.geforceerd_laden
              state: 'off'
          sequence:
            - variables:
                productie_w: '{{ states(''sensor.solaredge_current_power'') | float(0) }}'
                # 400W reservering voor huishoudelijk verbruik
                laad_vermogen_w: '{{ [productie_w - 400, 0] | max }}'
                # Berekening op basis van 1-fase (230V), min 6A, max 16A
                beschikbare_ampere: '{{ [[(laad_vermogen_w / 230) | round(0, ''floor'') | int, 6] | max, 16] | min }}'
                # Minimaal 6A nodig (IEC 61851 minimum = 1380W op 1-fase)
                genoeg_zon: '{{ laad_vermogen_w / 230 >= 6 }}'
            - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ genoeg_zon }}'
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.YOUR_INSTALL_NAME_available_current
                      data:
                        value: '{{ beschikbare_ampere }}'
                - conditions:
                    - condition: template
                      value_template: '{{ not genoeg_zon }}'
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.YOUR_INSTALL_NAME_available_current
                      data:
                        value: 6
  mode: restart

- id: 'zaptec_melding_bij_aansluiten_auto'
  alias: Zaptec melding bij aansluiten auto
  triggers:
    - trigger: state
      entity_id: sensor.YOUR_CHARGER_NAME_charger_mode
      to: connected_requesting
  actions:
    - action: notify.mobile_app_YOUR_MOBILE_APP
      data:
        title: Auto aangesloten
        message: Hoe wil je laden?
        data:
          actions:
            - action: ZONLADEN
              title: Zonneladen (1-fase)
            - action: GEFORCEERD
              title: Geforceerd laden (3-fase)
  mode: single

- id: 'zaptec_verwerk_laadkeuze'
  alias: Zaptec verwerk laadkeuze
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: ZONLADEN
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: GEFORCEERD
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger.event.data.action == ''ZONLADEN'' }}'
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.geforceerd_laden
        - conditions:
            - condition: template
              value_template: '{{ trigger.event.data.action == ''GEFORCEERD'' }}'
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.geforceerd_laden
  mode: single