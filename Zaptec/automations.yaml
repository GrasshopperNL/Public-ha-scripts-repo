###############################################################################
# Zaptec Solar Charging Automations
#
# Vereisten:
#   - Zaptec Go 2 laadpaal
#   - custom-components/zaptec integratie (via HACS)
#   - P1 slimme meter gekoppeld aan Home Assistant
#   - Home Assistant Companion App (Android/iOS)
#
# Pas de volgende placeholders aan naar jouw situatie:
#   - YOUR_CHARGER_NAME   : naam van jouw Zaptec laadpaal (bv. fam_veenbrink)
#   - YOUR_INSTALL_NAME   : naam van jouw Zaptec installatie (bv. franseweg_115)
#   - YOUR_MOBILE_APP     : naam van jouw mobiele app (bv. pixel_9_pro_xl)
###############################################################################

- id: 'zaptec_melding_bij_aansluiten_auto'
  alias: Zaptec melding bij aansluiten auto
  triggers:
    - trigger: state
      entity_id: sensor.YOUR_CHARGER_NAME_charger_mode
      to: connected_requesting
  actions:
    - action: notify.mobile_app_YOUR_MOBILE_APP
      data:
        title: Auto aangesloten
        message: Hoe wil je laden?
        data:
          actions:
            - action: ZONLADEN
              title: Zonneladen (1-fase)
            - action: GEFORCEERD
              title: Geforceerd laden (3-fase)
  mode: single

- id: 'zaptec_verwerk_laadkeuze'
  alias: Zaptec verwerk laadkeuze
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: ZONLADEN
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: GEFORCEERD
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger.event.data.action == ''ZONLADEN'' }}'
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.zaptec_geforceerd_laden
        - conditions:
            - condition: template
              value_template: '{{ trigger.event.data.action == ''GEFORCEERD'' }}'
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.zaptec_geforceerd_laden
  mode: single

- id: 'zaptec_zonnepaneel_laden'
  alias: Zaptec zonnepaneel laden
  description: Zonneladen op 1-fase of geforceerd laden op 3-fase
  triggers:
    - trigger: state
      entity_id: input_boolean.zaptec_geforceerd_laden
    - trigger: time_pattern
      seconds: /30
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.zaptec_geforceerd_laden
              state: 'on'
          sequence:
            # Zet schakeldrempel op 0 = altijd 3-fase
            - action: number.set_value
              target:
                entity_id: number.YOUR_INSTALL_NAME_3_to_1_phase_switch_current
              data:
                value: 0
            # Wacht op fase-wisseling
            - delay:
                seconds: 5
            - action: button.press
              target:
                entity_id: button.YOUR_CHARGER_NAME_resume_charging
            - action: number.set_value
              target:
                entity_id: number.YOUR_INSTALL_NAME_available_current
              data:
                value: 16
        - conditions:
            - condition: state
              entity_id: input_boolean.zaptec_geforceerd_laden
              state: 'off'
          sequence:
            # Zet schakeldrempel op 32 = altijd 1-fase
            - action: number.set_value
              target:
                entity_id: number.YOUR_INSTALL_NAME_3_to_1_phase_switch_current
              data:
                value: 32
            - variables:
                # Pas sensor naam aan naar jouw P1 productiesensor
                productie_w: '{{ states(''sensor.electricity_meter_power_production'') | float(0) }}'
                # Berekening op basis van 1-fase (230V), min 6A, max 16A
                beschikbare_ampere: '{{ [[(productie_w / 230) | round(0, ''floor'') | int, 6] | max, 16] | min }}'
                # Minimaal 6A nodig (IEC 61851 minimum = 1380W op 1-fase)
                genoeg_zon: '{{ (productie_w / 230) >= 6 }}'
            - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ genoeg_zon }}'
                  sequence:
                    - action: button.press
                      target:
                        entity_id: button.YOUR_CHARGER_NAME_resume_charging
                    - action: number.set_value
                      target:
                        entity_id: number.YOUR_INSTALL_NAME_available_current
                      data:
                        value: '{{ beschikbare_ampere }}'
                - conditions:
                    - condition: template
                      value_template: '{{ not genoeg_zon }}'
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.YOUR_INSTALL_NAME_available_current
                      data:
                        value: 6
                    - action: button.press
                      target:
                        entity_id: button.YOUR_CHARGER_NAME_stop_charging
  mode: restart
